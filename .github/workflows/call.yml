name: call

# One phone call per brief in calls/<id>.json, placed from a GitHub-hosted runner.
#   push a new brief  -> dry run by default (simulated counterpart, no Twilio, no model
#                        needed); a brief with "live": true dials the number for real
#   workflow_dispatch -> pick a brief by id, optionally force a dry run
# The transcript and result are committed back under calls/<id>/.

on:
  push:
    branches: [main]
    paths: ["calls/*.json"]
  workflow_dispatch:
    inputs:
      brief:
        description: brief id (calls/<id>.json)
        required: true
        default: example
      dry_run:
        description: ignore "live" in the brief and simulate the other party
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: call-${{ github.ref }}
  cancel-in-progress: false

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: python packages
        run: python -m pip install -q anthropic

      - name: which briefs to run
        id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            briefs="calls/${{ inputs.brief }}.json"
            [ -f "$briefs" ] || { echo "no such brief: $briefs"; exit 1; }
          else
            briefs=$(git diff --name-only HEAD~1 HEAD -- 'calls/*.json' 2>/dev/null || ls calls/*.json)
            # a brief that already has a result is finished; it only re-runs by dispatch
            keep=""
            for b in $briefs; do
              [ -f "$b" ] || continue
              id=$(basename "$b" .json)
              [ -f "calls/$id/result.json" ] && { echo "skip $b (already has a result)"; continue; }
              keep="$keep $b"
            done
            briefs="$keep"
          fi
          echo "briefs=$briefs" >> "$GITHUB_OUTPUT"
          echo "running:$briefs"

      - name: live mode?
        id: live
        shell: bash
        run: |
          live=0
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            for b in ${{ steps.pick.outputs.briefs }}; do
              python -c "import json,sys; sys.exit(0 if json.load(open('$b')).get('live') else 1)" && live=1
            done
          fi
          if [ "$live" = "1" ] && [ -z "$TWILIO_AUTH_TOKEN" ]; then
            echo "::error::a brief asks for a live call but the TWILIO_* secrets are not set"; exit 1
          fi
          echo "live=$live" >> "$GITHUB_OUTPUT"

      - name: cloudflared (public URL for Twilio's webhooks)
        if: steps.live.outputs.live == '1'
        run: |
          curl -sSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb >/dev/null
          cloudflared --version

      - name: place the call(s)
        shell: bash
        run: |
          flag=""
          [ "${{ steps.live.outputs.live }}" = "1" ] && flag="--live"
          for b in ${{ steps.pick.outputs.briefs }}; do
            echo "=== $b ==="
            python agent/call.py "$b" $flag
          done

      - name: commit the transcript back
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calls/*/transcript.md calls/*/result.json 2>/dev/null || true
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "call: transcript for run ${{ github.run_number }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((i * 5))
          done
